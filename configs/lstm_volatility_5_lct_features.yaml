data:
  csv_path: data/processed/BTC_daily_train.csv
  feature_columns:
    - Open
    - High
    - Low
    - Close
    - Volume
    - log_return
    - abs_log_return
    - high_low_range
    - close_open_return
    - rolling_vol_5
    - rolling_vol_10
    - rolling_vol_20
    - volume_change
  derived_features:
    - log_return
    - abs_log_return
    - high_low_range
    - close_open_return
    - rolling_vol_5
    - rolling_vol_10
    - rolling_vol_20
    - volume_change
  target_type: volatility_5
  sequence_length: 60
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  batch_size: 32
  num_workers: 0

model:
  input_dim: 13
  hidden_dim: 32
  lstm_hidden_dim: 64
  num_layers: 2
  output_dim: 1
  dropout: 0.1
  bidirectional: false
  use_lct_riesz: true

training:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  seed: 42
  device: auto

experiment:
  name: lstm_volatility_5_lct_riesz_features
  save_outputs: true
