data:
  csv_path: data/processed/BTC_daily_train.csv
  feature_columns:
    - Open
    - High
    - Low
    - Close
    - Volume
    - log_return
    - abs_log_return
    - high_low_range
    - close_open_return
  derived_features:
    - log_return
    - abs_log_return
    - high_low_range
    - close_open_return
  target_type: volatility_5
  sequence_length: 60
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  batch_size: 32
  num_workers: 0

model:
  type: residual_auxiliary_signal_lstm
  input_dim: 9
  hidden_dim: 32
  lstm_hidden_dim: 64
  num_layers: 2
  output_dim: 1
  dropout: 0.1
  bidirectional: false
  use_lct_riesz: false
  signal_feature_indices:
    - 5
    - 6
    - 7
    - 8
  residual_scale_init: 0.0

training:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  seed: 42
  device: auto

experiment:
  name: lstm_volatility_5_residual_no_lct_signal_features
  save_outputs: true
  outputs_root: experiments/lstm/outputs
  checkpoints_root: experiments/lstm/checkpoints
